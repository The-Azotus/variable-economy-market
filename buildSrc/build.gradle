// The convention plugin build.gradle applies (src/main/groovy). ModDevGradle is on its classpath here, so
// build.gradle applies it without a version.
plugins {
    id 'groovy-gradle-plugin'
}

repositories {
    gradlePluginPortal()
    maven { url = 'https://maven.neoforged.net/releases' }
}

dependencies {
    implementation 'net.neoforged:moddev-gradle:2.0.148'
}
