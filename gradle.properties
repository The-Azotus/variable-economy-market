org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# ---- Shared by the Variable Economy mods: the same in each repository ----
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.228
loader_version_range=[1,)

# Dependencies. Ponder, Flywheel and Registrate are the exact versions Create 6.0.10-281 bundles via jar-in-jar.
create_version=6.0.10-281
create_version_range=[6.0.10,6.1.0)
ponder_version=1.0.82+mc1.21.1
flywheel_version=1.0.6
registrate_version=MC1.21-1.3.0+67
# Optional. The lock API was verified against the 3.1.1 jar; StagesBridge survives a changed API by logging and
# hiding nothing, so later 3.x versions are allowed to load.
progressivestages_version=3.1.1
progressivestages_version_range=[3.1.1,4)
# Optional. The team API was verified against 2101.1.11; FtbTeamsBridge checks it by reflection and
# falls back to the mod's own teams if it changed.
ftbteams_version=2101.1.11
ftbteams_version_range=[2101.1.11,2102)
ftblibrary_version=2101.1.30
# Optional. The plugin and binding API was checked against 2101.7.2-build.381; compat/KubeJsBridge is
# the only class that touches it. KubeJS bundles its own libraries (jar-in-jar); Rhino is its scripting engine.
kubejs_version=2101.7.2-build.381
kubejs_version_range=[2101.7,2102)
rhino_version=2101.2.7-build.85
architectury_version=13.0.8
mod_license=MIT
mod_group_id=variableeconomy

# ---- This mod ----
module=market
mod_id=variable_economy_market
mod_name=Variable Economy: Market
mod_version=0.6.1
repo_url=https://github.com/The-Azotus/variable-economy-market

# ---- Core, which this mod requires ----
# core_source: curseforge (the released jar named below, through CurseMaven) or local (variableeconomy:core from
# `gradlew publishToMavenLocal` in variable-economy-core, for building against a core that isn't released).
core_version=0.6.2
core_source=curseforge
core_curseforge_slug=variable-economy
core_curseforge_project=1818087
core_curseforge_file=9710072
